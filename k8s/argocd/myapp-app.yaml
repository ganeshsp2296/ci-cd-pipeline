apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/ganeshsp2296/ci-cd-pipeline.git'   # your repo
    targetRevision: ganesh.developer   # branch name
    path: k8s                          # folder where manifests live (your myapp-deployment.yaml + service)

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
