apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 172.31.10.224:30800/docker-hosted-repo/ci-cd-app:latest   # replace with your actual image name
          ports:
            - containerPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
    - port: 8090         # Service port
      targetPort: 8090   # Container port
      nodePort: 30090    # Fixed NodePort (external access)

